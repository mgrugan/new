<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Econ 100 Study Hub</title>
<style>
  /* Design tokens */
  :root, :root[data-theme="light"], :root[data-theme="dark"] {
    color-scheme: dark;
    --bg-1: #000000; --bg-2: #2D3748; --bg-3: #4A5568; --bg-4: #374151;
    --surface: #1E293B; --option: #16213E;
    --ink: #F7FAFC; --ink-2: #E2E8F0; --muted: #A0AEC0; --line: #4A5568;
    --cyan: #69C9D0; --pink: #EE1D52; --accent: #00D4FF; --purple: #8B5CF6;
    --good: #22C55E; --bad: #EF4444; --gold: #FCD34D;
    --grad: linear-gradient(135deg, #69C9D0, #EE1D52, #69C9D0);
    --grad-btn: linear-gradient(135deg, #69C9D0, #EE1D52);
    --card-grad: linear-gradient(135deg, #2D3748, #4A5568 70%, #374151);
    --c-d: #63B3ED; --c-s: #F6AD55; --c-x: #FC8181; --c-b: #68D391; --c-p: #D6BCFA; --c-k: #F7FAFC; --c-m: #A0AEC0;
    --accent-soft: rgba(105, 201, 208, .12);
  }
  * { box-sizing: border-box; }
  html { background: #000; }
  body { margin: 0; min-height: 100vh; color: var(--ink);
    background: #000;
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 0 16px; }
  a { color: var(--accent); }

  /* Header */
  header { position: sticky; top: 0; z-index: 5; background: rgba(0, 0, 0, .9); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
  .hrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0 6px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand .name { font-size: 20px; font-weight: 800; letter-spacing: .01em; color: var(--ink); line-height: 1; }
  .brand .sub { font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: .04em; }
  #overall { font-size: 13px; color: var(--muted); background: var(--bg-2); border: 1px solid var(--line); padding: 4px 12px; border-radius: 999px; }
  #overall b { color: var(--accent); }

  /* Lecture tabs */
  .tabs { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 10px; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs button { flex: 0 0 auto; font: inherit; font-size: 14px; font-weight: 600; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg-2); color: var(--ink-2); cursor: pointer; white-space: nowrap; transition: border-color .15s, transform .15s; }
  .tabs button:hover { border-color: var(--cyan); }
  .tabs button.on { background: var(--grad-btn); border-color: transparent; color: #fff; box-shadow: 0 0 16px rgba(238, 29, 82, .3); }
  .tabs .mini { font-size: 12px; opacity: .85; margin-left: 6px; font-weight: 700; }
  .tabwrap { position: relative; }
  .tabwrap::before, .tabwrap::after { content: ""; position: absolute; top: 0; bottom: 10px; width: 60px; pointer-events: none; transition: opacity .2s; opacity: 0; z-index: 1; }
  .tabwrap::before { left: 0; background: linear-gradient(to right, var(--bg-1) 35%, transparent); }
  .tabwrap::after { right: 0; background: linear-gradient(to left, var(--bg-1) 35%, transparent); }
  .tabwrap.more-left::before, .tabwrap.more-right::after { opacity: 1; }
  .tabarrow { position: absolute; top: 4px; z-index: 2; width: 32px; height: 32px; border-radius: 50%; border: 2px solid transparent; background: linear-gradient(var(--bg-2), var(--bg-2)) padding-box, var(--grad-btn) border-box; color: #fff; font-size: 20px; line-height: 1; cursor: pointer; display: none; box-shadow: 0 0 12px rgba(105, 201, 208, .35); }
  .tabarrow.left { left: 0; } .tabarrow.right { right: 0; }
  .tabwrap.more-left .tabarrow.left, .tabwrap.more-right .tabarrow.right { display: block; }
  .tabwrap.more-right .tabarrow.right { animation: nudge 1.4s ease-in-out 3; }
  @keyframes nudge { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(4px); } }
  .tabhint { font-size: 12px; color: var(--muted); padding: 0 0 8px; display: none; }
  .tabhint.show { display: block; }

  /* Layout and cards */
  section { padding: 24px 0 8px; }
  h2 { font-size: 28px; font-weight: 800; margin: 2px 0 4px; letter-spacing: -.01em; }
  h3 { font-size: 19px; font-weight: 700; margin: 26px 0 10px; color: var(--ink); }
  .lede { color: var(--ink-2); opacity: .85; margin: 0 0 4px; }
  .card { background: var(--card-grad); border-radius: 20px; padding: 20px; margin: 16px 0; box-shadow: 0 6px 20px rgba(0, 0, 0, .25); }
  .card > h3:first-child { margin-top: 0; }
  .glow { border: 2px solid transparent; background: linear-gradient(rgba(30, 41, 59, .92), rgba(30, 41, 59, .92)) padding-box, var(--grad) border-box; box-shadow: 0 0 28px rgba(105, 201, 208, .18), 0 6px 20px rgba(0, 0, 0, .3); border-radius: 24px; }
  .hero { padding: 22px 22px 20px; margin-top: 4px; }
  .tag { display: inline-block; font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: #fff; background: var(--grad-btn); padding: 2px 10px; border-radius: 999px; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }
  .intuit { border-left: 4px solid var(--cyan); background: var(--accent-soft); padding: 12px 14px; border-radius: 0 12px 12px 0; margin: 14px 0; color: var(--ink-2); }
  ul, ol { padding-left: 22px; } li { margin: 5px 0; }
  b { color: var(--ink); }
  table { border-collapse: collapse; width: 100%; font-size: 15px; }
  th, td { border-bottom: 1px solid rgba(160, 174, 192, .25); padding: 8px; text-align: left; vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 13px; text-transform: uppercase; letter-spacing: .03em; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .tblwrap { overflow-x: auto; }

  /* Graphs */
  .fig { margin: 10px 0; }
  .fig svg { width: 100%; max-width: 520px; height: auto; display: block; background: rgba(15, 15, 35, .35); border-radius: 14px; }
  .fig svg text { fill: var(--muted); font-size: 12px; font-family: inherit; }
  .figcap { font-size: 13px; color: var(--muted); margin-top: 6px; }
  .sim { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 18px; align-items: start; }
  @media (max-width: 720px) { .sim { grid-template-columns: 1fr; } }
  label { display: block; font-size: 14px; font-weight: 700; margin-top: 10px; }
  input[type=range] { width: 100%; accent-color: var(--pink); }
  .readout { font-size: 15px; background: rgba(15, 15, 35, .45); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-top: 12px; font-variant-numeric: tabular-nums; }

  /* Videos */
  .vids { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
  .vids > div { background: var(--card-grad); border-radius: 16px; padding: 10px; }
  .video { aspect-ratio: 16/9; width: 100%; border: 0; border-radius: 12px; background: #000; }
  .vcap { font-size: 14px; color: var(--ink-2); margin: 6px 4px 2px; font-weight: 600; }

  /* Goods grid */
  .goods { display: grid; grid-template-columns: 90px 1fr 1fr; gap: 6px; font-size: 14px; max-width: 560px; }
  .goods div { padding: 10px; border-radius: 12px; }
  .goods .hd { font-weight: 800; color: var(--muted); display: flex; align-items: center; justify-content: center; text-align: center; font-size: 12px; letter-spacing: .03em; }
  .goods .cell { background: var(--option); border: 1px solid var(--line); }
  .goods .cell b { display: block; color: var(--accent); }
  .goods .cell span { color: var(--ink-2); font-size: 13px; }

  /* Quiz (multiple-choice style) */
  .q { background: var(--card-grad); border-radius: 20px; padding: 20px; margin: 14px 0; box-shadow: 0 6px 20px rgba(0, 0, 0, .25); }
  .q .qh { font-weight: 600; font-size: 17px; line-height: 1.5; margin-bottom: 12px; }
  .q .qn { display: inline-block; color: #fff; background: var(--grad-btn); font-size: 12px; font-weight: 800; padding: 1px 9px; border-radius: 999px; margin-right: 8px; vertical-align: 2px; }
  .q .kind { display: inline-block; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; padding: 1px 8px; border-radius: 999px; background: rgba(0, 212, 255, .14); color: var(--accent); margin-left: 6px; vertical-align: 2px; }
  .opt { display: block; width: 100%; text-align: left; font: inherit; font-size: 15px; margin: 10px 0; padding: 13px 16px; border-radius: 12px; border: 1px solid #374151; background: var(--option); color: var(--ink); cursor: pointer; transition: border-color .15s, transform .1s; }
  .opt:hover:not(:disabled) { border-color: var(--cyan); transform: translateY(-1px); }
  .opt:disabled { cursor: default; opacity: .75; }
  .opt.right { background: rgba(34, 197, 94, .13); border: 2px solid var(--good); color: var(--good); opacity: 1; font-weight: 600; }
  .opt.wrong { background: rgba(239, 68, 68, .13); border: 2px solid var(--bad); color: var(--bad); opacity: 1; }
  .q.pop { animation: pop .6s ease; }
  @keyframes pop { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.02); } }
  .explain { margin-top: 10px; font-size: 15px; padding: 12px 14px; border-radius: 12px; background: rgba(15, 15, 35, .45); color: var(--ink-2); }
  .scorebar { position: sticky; bottom: 12px; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 18px; padding: 12px 16px; border: 2px solid transparent; border-radius: 18px; background: linear-gradient(rgba(0, 0, 0, .95), rgba(0, 0, 0, .95)) padding-box, var(--grad) border-box; box-shadow: 0 0 22px rgba(105, 201, 208, .22); }
  .scorebar b { color: var(--accent); }
  .btn { font: inherit; font-size: 14px; font-weight: 700; padding: 8px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg-2); color: var(--ink); cursor: pointer; }
  .btn:hover { border-color: var(--cyan); }
  @media (max-width: 520px) { .scorebar { flex-wrap: nowrap; padding: 8px 12px; font-size: 14px; } .scorebar .btn { padding: 6px 10px; font-size: 13px; white-space: nowrap; } .hrow { padding-top: 8px; } }
  footer { color: var(--muted); font-size: 13px; padding: 30px 16px 40px; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="hrow">
      <div class="brand"><div><div class="name">Econ 100 Study Hub</div><div class="sub">LECTURES 17–23</div></div></div>
      <span id="overall"></span>
    </div>
    <div class="tabwrap" id="tabwrap">
      <button class="tabarrow left" id="tabL" aria-label="Scroll lectures left">‹</button>
      <nav class="tabs" id="tabs"></nav>
      <button class="tabarrow right" id="tabR" aria-label="Scroll lectures right">›</button>
    </div>
    <div class="tabhint" id="tabhint">← Swipe or use the arrows to see all lectures and the Final Quiz →</div>
  </div>
</header>
<main class="wrap" id="main"></main>
<footer class="wrap">Built from Econ 100 lectures L17–L23 (Treado, Pitt). Graph numbers in the practice figures are made up for practice unless a lecture is cited. Videos are third-party YouTube content.</footer>

<script>
/* =========================================================
   Chart helper: draws simple economics graphs from a spec
   ========================================================= */
const NS = "http://www.w3.org/2000/svg";
function E(tag, attrs, text) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  return e;
}
const COL = { d: "--c-d", s: "--c-s", x: "--c-x", b: "--c-b", p: "--c-p", k: "--c-k", m: "--c-m" };
const col = c => getComputedStyle(document.documentElement).getPropertyValue(COL[c] || c).trim();

function chart(spec) {
  const W = 440, H = 310, L = 52, R = 412, T = 18, B = 262;
  const sx = x => L + (x / spec.xMax) * (R - L), sy = y => B - (y / spec.yMax) * (B - T);
  const svg = E("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": spec.alt || "graph" });
  const fmtx = spec.fx || (v => v), fmty = spec.fy || (v => v);
  (spec.xt || []).forEach(v => svg.appendChild(E("text", { x: sx(v), y: B + 16, "text-anchor": "middle" }, fmtx(v))));
  (spec.yt || []).forEach(v => svg.appendChild(E("text", { x: L - 6, y: sy(v) + 4, "text-anchor": "end" }, fmty(v))));
  const txt = (x, y, s, c, anchor = "start", bold = true) => {
    const t = E("text", { x, y, "text-anchor": anchor }, s);
    t.style.fill = col(c); if (bold) t.style.fontWeight = "700"; svg.appendChild(t);
  };
  for (const it of spec.items) {
    const c = col(it.c || "k");
    if (it.t === "poly") {
      svg.appendChild(E("polygon", { points: it.p.map(([x, y]) => `${sx(x)},${sy(y)}`).join(" "), fill: c, opacity: it.op ?? 0.22 }));
      if (it.lab) txt(sx(it.lp[0]), sy(it.lp[1]), it.lab, it.c, "middle");
    } else if (it.t === "line" || it.t === "path") {
      const pts = it.p.map(([x, y]) => `${sx(x)},${sy(y)}`).join(" ");
      svg.appendChild(E("polyline", { points: pts, fill: "none", stroke: c, "stroke-width": it.w || 2.5, "stroke-linecap": "round", "stroke-linejoin": "round", "stroke-dasharray": it.dash ? "6 4" : "none" }));
      if (it.lab) {
        const [x, y] = it.lp || it.p[it.p.length - 1];
        txt(sx(x) + (it.dx ?? 4), sy(y) + (it.dy ?? -6), it.lab, it.c, it.anchor || "start");
      }
    } else if (it.t === "h") {
      svg.appendChild(E("line", { x1: L, y1: sy(it.y), x2: R, y2: sy(it.y), stroke: c, "stroke-width": 2, "stroke-dasharray": it.dash === false ? "none" : "6 4" }));
      if (it.lab) txt(R, sy(it.y) - 6, it.lab, it.c, "end");
    } else if (it.t === "v") {
      svg.appendChild(E("line", { x1: sx(it.x), y1: T, x2: sx(it.x), y2: B, stroke: c, "stroke-width": 2, "stroke-dasharray": "6 4" }));
      if (it.lab) txt(sx(it.x) + 4, T + 12, it.lab, it.c);
    } else if (it.t === "guide") {
      const [x, y] = it.p;
      svg.appendChild(E("polyline", { points: `${L},${sy(y)} ${sx(x)},${sy(y)} ${sx(x)},${B}`, fill: "none", stroke: col("m"), "stroke-width": 1, "stroke-dasharray": "3 3" }));
    } else if (it.t === "dot") {
      svg.appendChild(E("circle", { cx: sx(it.p[0]), cy: sy(it.p[1]), r: 4.5, fill: c }));
      if (it.lab) txt(sx(it.p[0]) + (it.dx ?? 7), sy(it.p[1]) + (it.dy ?? -7), it.lab, it.c, it.anchor || "start");
    } else if (it.t === "bar") {
      svg.appendChild(E("rect", { x: sx(it.x - it.w / 2), y: sy(it.y), width: sx(it.w) - sx(0), height: B - sy(it.y), fill: c, opacity: it.op ?? 0.75, rx: 2 }));
      if (it.lab) txt(sx(it.x), sy(it.y) - 5, it.lab, it.c, "middle");
    } else if (it.t === "txt") {
      txt(sx(it.p[0]), sy(it.p[1]), it.s, it.c, it.anchor || "start", it.bold !== false);
    }
  }
  svg.appendChild(E("line", { x1: L, y1: B, x2: R + 6, y2: B, stroke: col("m") }));
  svg.appendChild(E("line", { x1: L, y1: T - 6, x2: L, y2: B, stroke: col("m") }));
  svg.appendChild(E("text", { x: R + 6, y: H - 10, "text-anchor": "end" }, spec.xl));
  svg.appendChild(E("text", { x: 6, y: 12 }, spec.yl));
  return svg;
}
function figNode(key) {
  const f = FIGS[key];
  const wrap = document.createElement("div"); wrap.className = "fig";
  if (f.html) wrap.innerHTML = f.html;
  else wrap.appendChild(chart(f));
  if (f.cap) { const c = document.createElement("div"); c.className = "figcap"; c.innerHTML = f.cap; wrap.appendChild(c); }
  return wrap;
}

/* =========================================================
   Figures
   ========================================================= */
const GOODS_GRID = `
<div class="goods">
  <div></div><div class="hd">EXCLUDABLE<br>(can block non-payers)</div><div class="hd">NON-EXCLUDABLE<br>(can't block)</div>
  <div class="hd">RIVAL<br>(use it up)</div>
  <div class="cell"><b>Private good</b><span>pizza, clothes, a phone</span></div>
  <div class="cell"><b>Common resource</b><span>ocean fish, a free but congested road</span></div>
  <div class="hd">NON-RIVAL<br>(share it)</div>
  <div class="cell"><b>Natural monopoly / club good</b><span>Netflix, cable TV, an uncongested toll road</span></div>
  <div class="cell"><b>Public good</b><span>national defense, street lamps, a lighthouse</span></div>
</div>`;

const FIGS = {
  goods: { html: GOODS_GRID, cap: "The two questions that sort every good: <b>Is it rival?</b> <b>Is it excludable?</b>" },

  lamps: {
    xMax: 6, yMax: 20, xl: "Number of lamps", yl: "$", alt: "Marginal social benefit of lamps vs cost",
    xt: [1, 2, 3, 4, 5], yt: [3, 5, 9, 13, 17], fy: v => "$" + v,
    items: [
      { t: "bar", x: 1, y: 17, w: 0.6, c: "b", lab: "$17" },
      { t: "bar", x: 2, y: 13, w: 0.6, c: "b", lab: "$13" },
      { t: "bar", x: 3, y: 9, w: 0.6, c: "b", lab: "$9" },
      { t: "bar", x: 4, y: 5, w: 0.6, c: "b", lab: "$5" },
      { t: "bar", x: 5, y: 0.15, w: 0.6, c: "b", lab: "$0" },
      { t: "h", y: 3, c: "x", lab: "Cost $3" }
    ],
    cap: "Green bars = MB to the whole apartment (Joe + Mike + Sam) of each extra lamp. Each lamp costs $3."
  },

  cap: {
    xMax: 400, yMax: 70, xl: "Allowances (million tons CO₂)", yl: "$ per ton", alt: "Cap and trade allowance market",
    xt: [200, 300], yt: [10, 29], fy: v => "$" + v,
    items: [
      { t: "line", p: [[0, 67], [352, 0]], c: "d", lab: "Demand for allowances", lp: [180, 32.8], dx: 8, dy: -4 },
      { t: "v", x: 300, c: "s", lab: "Cap 2012" },
      { t: "v", x: 200, c: "p", lab: "Lower cap" },
      { t: "guide", p: [300, 10] }, { t: "guide", p: [200, 29] },
      { t: "dot", p: [300, 10], c: "s" }, { t: "dot", p: [200, 29], c: "p" }
    ],
    cap: "Illustrative. The cap is a vertical supply curve: the government sets the quantity. California allowance prices rose from about $10 (2012) to $29 (2022)."
  },

  negx: {
    xMax: 80, yMax: 110, xl: "Quantity of paper (tons)", yl: "Price ($)", alt: "Negative externality graph",
    xt: [30, 40], yt: [20, 40, 60, 70, 80, 100], fy: v => "$" + v,
    items: [
      { t: "poly", p: [[30, 70], [40, 80], [40, 60]], c: "x", op: 0.28 },
      { t: "line", p: [[0, 100], [80, 20]], c: "d", lab: "D = MPB = MSB", lp: [80, 20], dx: -4, dy: -8, anchor: "end" },
      { t: "line", p: [[0, 20], [80, 100]], c: "s", lab: "S = MPC", lp: [62, 82], dx: 8, dy: 16 },
      { t: "line", p: [[0, 40], [65, 105]], c: "x", lab: "MSC", lp: [65, 105], dx: -6, dy: 2, anchor: "end" },
      { t: "guide", p: [40, 60] }, { t: "guide", p: [30, 70] }, { t: "guide", p: [40, 80] },
      { t: "dot", p: [40, 60], c: "k", lab: "A" }, { t: "dot", p: [30, 70], c: "x", lab: "C", dx: -16 }
    ],
    cap: "A paper factory pollutes a river. MSC = MPC + MEC. Red triangle = deadweight loss from overproduction."
  },

  posx: {
    xMax: 80, yMax: 130, xl: "College students (thousands)", yl: "Price ($K)", alt: "Positive externality graph",
    xt: [45, 55], yt: [10, 45, 55, 65, 75, 100, 120], fy: v => "$" + v + "K",
    items: [
      { t: "poly", p: [[45, 55], [45, 75], [55, 65]], c: "x", op: 0.28 },
      { t: "line", p: [[0, 100], [80, 20]], c: "d", lab: "D = MPB", lp: [80, 20], dx: -4, dy: -8, anchor: "end" },
      { t: "line", p: [[0, 120], [80, 40]], c: "b", lab: "MSB", lp: [80, 40], dx: -4, dy: -8, anchor: "end" },
      { t: "line", p: [[0, 10], [80, 90]], c: "s", lab: "S = MC", lp: [80, 90], dx: -4, dy: -8, anchor: "end" },
      { t: "guide", p: [45, 55] }, { t: "guide", p: [55, 65] }, { t: "guide", p: [45, 75] }, { t: "guide", p: [45, 45] },
      { t: "dot", p: [45, 55], c: "k", lab: "A", dx: -16 }, { t: "dot", p: [55, 65], c: "b", lab: "C" }
    ],
    cap: "Education has external benefits (MEB). MSB = MPB + MEB. Red triangle = deadweight loss from underproduction."
  },

  ppf: {
    xMax: 40, yMax: 66, xl: "Drinks per hour", yl: "Burgers per hour", alt: "Joint PPF of Joe and Liz",
    xt: [18, 30, 36], yt: [30, 60],
    items: [
      { t: "path", p: [[0, 60], [30, 30], [36, 0]], c: "p", w: 3 },
      { t: "guide", p: [30, 30] },

function drawTaxSim() {
  const t = +document.getElementById("taxR").value;
  document.getElementById("taxV").textContent = t;
  const Q = (80 - t) / 2, Pb = 100 - Q, Ps = Pb - t, dwl = (Q - 30) ** 2;
  const items = [
    { t: "line", p: [[0, 100], [80, 20]], c: "d", lab: "D = MSB", lp: [80, 20], dx: -4, dy: -8, anchor: "end" },
    { t: "line", p: [[0, 20], [80, 100]], c: "s", lab: "MPC", lp: [62, 82], dx: 8, dy: 16 },
    { t: "line", p: [[0, 40], [65, 105]], c: "x", lab: "MSC", lp: [65, 105], dx: -6, dy: 2, anchor: "end" }
  ];
  if (t > 0) items.push({ t: "line", p: [[0, 20 + t], [Math.min(80, 90 - t), 20 + t + Math.min(80, 90 - t)]], c: "p", dash: true, lab: "MPC + tax", lp: [10, 30 + t], dx: 0, dy: -8 });
  if (Math.abs(Q - 30) > 0.01) {
    items.unshift({ t: "poly", p: [[Q, 100 - Q], [Q, 40 + Q], [30, 70]], c: "x", op: 0.28 });
  }
  items.push({ t: "guide", p: [Q, Pb] }, { t: "dot", p: [Q, Pb], c: "p" }, { t: "dot", p: [30, 70], c: "x", lab: "C", dx: -16 });
  const box = document.getElementById("sim-negx"); box.innerHTML = "";
  box.appendChild(chart({ xMax: 80, yMax: 110, xl: "Paper (tons)", yl: "Price ($)", xt: [30, 40], yt: [20, 40, 60, 70, 80, 100], fy: v => "$" + v, items }));
  let msg;
  if (t === 20) msg = "✅ <b>Efficient!</b> A tax equal to the MEC ($20) makes firms pay the full social cost. Deadweight loss is gone.";
  else if (t < 20) msg = "Still <b>over</b>producing: the tax is smaller than the $20 external cost.";
  else msg = "Now <b>under</b>producing: the tax is bigger than the external cost, which creates a new deadweight loss.";
  document.getElementById("taxOut").innerHTML =
    `Quantity: <b>${Q.toFixed(1)}</b> tons (efficient = 30)<br>Buyers pay: <b>$${Pb.toFixed(1)}</b> · Sellers keep: <b>$${Ps.toFixed(1)}</b><br>Tax revenue: <b>$${(t * Q).toFixed(0)}</b><br>Deadweight loss: <b>$${dwl.toFixed(0)}</b><br>${msg}`;
}

/* =========================================================
   Quiz engine (options shuffled deterministically)
   ========================================================= */
function seeded(str) { let h = 2166136261; for (const c of str) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return () => ((h = Math.imul(h ^ (h >>> 15), 2246822507), h = Math.imul(h ^ (h >>> 13), 3266489909), (h ^= h >>> 16) >>> 0) / 4294967296); }
function shuffle(arr, rnd) { for (let j = arr.length - 1; j > 0; j--) { const r = Math.floor(rnd() * (j + 1)); [arr[j], arr[r]] = [arr[r], arr[j]]; } return arr; }
LECTURES.forEach(L => {
  // spread correct answers evenly across A–D within each lecture
  const lr = seeded(L.id), n = L.qs.length, base = [];
  for (let k = 0; k < Math.floor(n / 4); k++) base.push(0, 1, 2, 3);
  const slots = shuffle([...base, ...shuffle([0, 1, 2, 3], lr).slice(0, n % 4)], lr);
  L.qs.forEach((q, i) => {
    const wrong = shuffle(q.o.slice(1), seeded(L.id + i));
    q.ans = slots[i]; q.opts = wrong.slice(); q.opts.splice(q.ans, 0, q.o[0]);
  });
});

const ANS = {};
LECTURES.forEach(L => ANS[L.id] = {});
{ const F = LECTURES.find(L => L.final); shuffle(F.qs, seeded("final-order")); }

function lectureScore(L) {
  const a = ANS[L.id], keys = Object.keys(a);
  return { right: keys.filter(k => a[k] === L.qs[k].ans).length, done: keys.length };
}
function updateScores() {
  let r = 0, d = 0;
  LECTURES.forEach(L => {
    const s = lectureScore(L); r += s.right; d += s.done;
    const m = document.querySelector(`#tabs button[data-id="${L.id}"] .mini`);
    if (m) m.textContent = s.done ? `${s.right}/${L.qs.length}` : "";
  });
  document.getElementById("overall").innerHTML = `Overall: <b>${r}</b> correct of ${d} answered · ${LECTURES.reduce((t, L) => t + L.qs.length, 0)} total`;
  const cur = LECTURES.find(L => L.id === current), el = document.getElementById("lecScore");
  if (cur && el) { const s = lectureScore(cur); el.innerHTML = `${cur.final ? "Final" : cur.id} score: <b>${s.right}</b> / ${s.done} answered (of ${cur.qs.length})`; }
  const bd = document.getElementById("breakdown");
  if (cur && cur.final && bd) {
    const s = lectureScore(cur);
    if (s.done < cur.qs.length) { bd.innerHTML = ""; bd.className = ""; return; }
    bd.className = "card";
    const groups = {};
    cur.qs.forEach((q, i) => { const g = groups[q.l] ||= { r: 0, n: 0 }; g.n++; if (ANS[cur.id][i] === q.ans) g.r++; });
    const weak = Object.entries(groups).filter(([, g]) => g.r < g.n).map(([l]) => l);
    bd.innerHTML = `<h3>📊 Your results by section</h3><div class="tblwrap"><table><tr><th>Section</th><th class="num">Score</th></tr>` +
      Object.entries(groups).sort(([a], [b]) => (a === "Mixed") - (b === "Mixed") || a.localeCompare(b)).map(([l, g]) => `<tr><td>${l === "Mixed" ? "Mixed (connects topics)" : l + " · " + LECTURES.find(x => x.id === l).title}</td><td class="num">${g.r === g.n ? "✅ " : ""}${g.r} / ${g.n}</td></tr>`).join("") +
      `</table></div><p>${weak.length ? "Review: <b>" + weak.join(", ") + "</b>. Re-read the 💡 boxes in those tabs, then reset and retry." : "Perfect score. You've got the intuition down."}</p>`;
  }
}

function renderQuiz(L) {
  const box = document.getElementById("qbox"); box.innerHTML = "";
  L.qs.forEach((q, i) => {
    const d = document.createElement("div"); d.className = "q";
    d.innerHTML = `<div class="qh"><span class="qn">Q${i + 1}</span>${q.q}<span class="kind">${q.k === "graph" ? "📈 graph" : "concept"}</span>${q.l ? `<span class="kind">${q.l}</span>` : ""}</div>`;
    if (q.fig) d.appendChild(figNode(q.fig));
    const picked = ANS[L.id][i];
    q.opts.forEach((opt, j) => {
      const b = document.createElement("button"); b.className = "opt";
      b.textContent = String.fromCharCode(65 + j) + ". " + opt;
      if (picked != null) {
        b.disabled = true;
        if (j === q.ans) b.classList.add("right"); else if (j === picked) b.classList.add("wrong");
      }
      b.onclick = () => {
        ANS[L.id][i] = j; renderQuiz(L); updateScores();
        if (j === q.ans) { const card = document.querySelectorAll("#qbox .q")[i]; if (card) card.classList.add("pop"); }
      };
      d.appendChild(b);
    });
    if (picked != null) {
      const ex = document.createElement("div"); ex.className = "explain";
      ex.innerHTML = (picked === q.ans ? "✅ <b>Correct.</b> " : "❌ <b>Not quite.</b> ") + q.e;
      d.appendChild(ex);
    }
    box.appendChild(d);
  });
}

   ========================================================= */
let current = "L17";
function show(id) {
  current = id;
  try { localStorage.setItem("econTab", id); } catch (e) {}
  if (location.hash !== "#" + id) history.replaceState(null, "", "#" + id);
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.id === id));
  const onBtn = document.querySelector(`#tabs button[data-id="${id}"]`);
  if (onBtn) onBtn.scrollIntoView({ block: "nearest", inline: "nearest" });
  if (typeof updateTabCue === "function") updateTabCue();
  const L = LECTURES.find(x => x.id === id);
  const main = document.getElementById("main");
  if (L.final) {
    main.innerHTML = `
    <section>
      <div class="glow hero">
      <span class="tag">L17–L23</span>
      <h2>🏁 Final Quiz</h2>
      <p class="lede">25 new questions: 3 from each lecture plus 4 that connect topics. These are fresh scenarios, not repeats of the notes, so you'll have to reason them out. Try it without looking back at the tabs. Your section-by-section results appear when you finish.</p>
      </div>
      <div id="qbox"></div>
      <div id="breakdown"></div>
      <div class="scorebar"><span id="lecScore"></span><button class="btn" id="resetBtn">Reset final</button></div>
    </section>`;
    document.getElementById("resetBtn").onclick = () => { ANS[L.id] = {}; renderQuiz(L); updateScores(); };
    renderQuiz(L); updateScores(); window.scrollTo(0, 0);
    return;
  }
  main.innerHTML = `
    <section>
      <div class="glow hero">
        <span class="tag">${L.id}</span>
        <h2>${L.title}</h2>
        <p class="lede">${L.lede}</p>
      </div>
      ${L.learn}
      <h3>📺 Videos</h3>
      <div class="vids">${L.videos.map(v => `<div><iframe class="video" src="https://www.youtube-nocookie.com/embed/${v.id}" title="${v.cap}" allowfullscreen loading="lazy"></iframe><div class="vcap">${v.cap}</div></div>`).join("")}</div>
      <h3 id="quiz">✏️ Practice: 10 questions</h3>
      <p class="lede">Questions tagged 📈 come with a graph to read. Click an answer to see the explanation.</p>
      <div id="qbox"></div>
      <div class="scorebar"><span id="lecScore"></span><button class="btn" id="resetBtn">Reset ${L.id}</button></div>
    </section>`;
  main.querySelectorAll("[id^=fig-]").forEach(el => el.appendChild(figNode(el.id.slice(4))));
  if (id === "L19") { document.getElementById("taxR").oninput = drawTaxSim; drawTaxSim(); }
  if (id === "L22") { document.getElementById("tarR").oninput = drawTariffSim; drawTariffSim(); }
  document.getElementById("resetBtn").onclick = () => { ANS[L.id] = {}; renderQuiz(L); updateScores(); };
  renderQuiz(L); updateScores();
  window.scrollTo(0, 0);
}

document.getElementById("tabs").innerHTML = LECTURES.map(L => `<button data-id="${L.id}">${L.final ? "🏁 Final Quiz" : L.id + " · " + L.title}<span class="mini"></span></button>`).join("");
document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => show(b.dataset.id));
const tabsEl = document.getElementById("tabs"), tabWrap = document.getElementById("tabwrap");
function updateTabCue() {
  const max = tabsEl.scrollWidth - tabsEl.clientWidth;
  tabWrap.classList.toggle("more-left", tabsEl.scrollLeft > 4);
  tabWrap.classList.toggle("more-right", tabsEl.scrollLeft < max - 4);
  document.getElementById("tabhint").classList.toggle("show", max > 4);
}
tabsEl.addEventListener("scroll", updateTabCue, { passive: true });
window.addEventListener("resize", updateTabCue);
document.getElementById("tabL").onclick = () => tabsEl.scrollBy({ left: -tabsEl.clientWidth * 0.7, behavior: "smooth" });
document.getElementById("tabR").onclick = () => tabsEl.scrollBy({ left: tabsEl.clientWidth * 0.7, behavior: "smooth" });
let start = location.hash.slice(1);
if (!LECTURES.some(L => L.id === start)) { try { start = localStorage.getItem("econTab") || "L17"; } catch (e) { start = "L17"; } }
if (!LECTURES.some(L => L.id === start)) start = "L17";
show(start);
updateTabCue();
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(current));
</script>
</body>
</html>
